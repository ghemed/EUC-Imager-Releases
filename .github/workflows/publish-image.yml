name: Publish Docker image

# Builds the Imager from the source repository (TerasGuy/EUC-Imager) and publishes
#   ghcr.io/ghemed/euc-imager:<version>  and  :latest
# It runs when a version tag such as v1.1.0 is pushed to this repository, or by hand:
# Actions, Publish Docker image, Run workflow, with the tag of the source to build (for example v1.1.0).
#
# Secret needed in this repository: SOURCE_READ_TOKEN, a fine-grained personal access token of the TerasGuy account
# with read-only "Contents" access to the single repository TerasGuy/EUC-Imager. It only lets this job read the source.
# The image is pushed with this repository's own GITHUB_TOKEN, so no broad package token is stored anywhere.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag of the source to build, for example v1.1.0'
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ghemed/euc-imager

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Version
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_VERSION:-$REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out the source
        uses: actions/checkout@v4
        with:
          repository: TerasGuy/EUC-Imager
          ref: ${{ steps.meta.outputs.tag }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/ghemed/EUC-Imager-Releases
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
